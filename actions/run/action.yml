name: Pomerium Dagger
description: >-
  Runs a Dagger command on the shared Pomerium CI engine. Without engine 
  credentials it runs on a temporary local engine instead.

inputs:
  verb:
    description: Dagger CLI command, such as check or generate.
    default: check
  args:
    description: Arguments for the command, for example `--check govulncheck`.
    default: ""
  engine-ca-cert:
    description: CA certificate of the shared engine. Pass secrets.DAGGER_CA_CERT.
    default: ""
  engine-client-cert:
    description: Client certificate for the shared engine. Pass secrets.DAGGER_CLIENT_CERT.
    default: ""
  engine-client-key:
    description: Client key for the shared engine. Pass secrets.DAGGER_CLIENT_KEY.
    default: ""

runs:
  using: composite
  steps:
    - name: Use the shared Dagger engine
      shell: bash
      env:
        DAGGER_ADDR: dagger.doxsey.net
        DAGGER_CA_CERT: ${{ inputs.engine-ca-cert }}
        DAGGER_CLIENT_CERT: ${{ inputs.engine-client-cert }}
        DAGGER_CLIENT_KEY: ${{ inputs.engine-client-key }}
      run: |
        if [ -z "$DAGGER_CLIENT_KEY" ]; then
          echo "No engine credentials; using a local engine."
          exit 0
        fi
        d="$RUNNER_TEMP/dagger-tls"
        mkdir -p "$d"
        printf '%s\n' "$DAGGER_CA_CERT" > "$d/ca.crt"
        printf '%s\n' "$DAGGER_CLIENT_CERT" > "$d/client.crt"
        (umask 077 && printf '%s\n' "$DAGGER_CLIENT_KEY" > "$d/client.key")
        echo "DAGGER_ENGINE=tls://$DAGGER_ADDR?ca_path=$d/ca.crt&cert_path=$d/client.crt&key_path=$d/client.key" >> "$GITHUB_ENV"

    # Install the Dagger CLI ourselves instead of with dagger/dagger-for-github, so it can be
    # cached: that action can't detect an installed 1.0 CLI and always downloads it again.
    - name: Select Dagger CLI
      id: dagger
      shell: bash
      env:
        # Must match daggerVersion in versions.go and the shared engine.
        DAGGER_VERSION: v1.0.0-beta.30
        RUNNER_ARCH: ${{ runner.arch }}
        RUNNER_OS: ${{ runner.os }}
        TOOL_CACHE: ${{ runner.tool_cache }}
      run: |
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) platform=linux_amd64 ;;
          Linux/ARM64) platform=linux_arm64 ;;
          *) echo "::error::unsupported runner: $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
        esac
        {
          echo "version=$DAGGER_VERSION"
          echo "platform=$platform"
          echo "dir=$TOOL_CACHE/dagger/$DAGGER_VERSION/$platform"
        } >> "$GITHUB_OUTPUT"

    - name: Cache Dagger CLI
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.dagger.outputs.dir }}
        key: dagger-cli-${{ steps.dagger.outputs.version }}-${{ steps.dagger.outputs.platform }}

    - name: Install Dagger CLI
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        DAGGER_VERSION: ${{ steps.dagger.outputs.version }}
        PLATFORM: ${{ steps.dagger.outputs.platform }}
        DIR: ${{ steps.dagger.outputs.dir }}
      run: |
        archive="dagger_${DAGGER_VERSION}_${PLATFORM}.tar.gz"
        base="https://dl.dagger.io/dagger/releases/${DAGGER_VERSION#v}"
        tmp="$(mktemp -d)"
        curl -fsSL --retry 3 -o "$tmp/$archive" "$base/$archive"
        curl -fsSL --retry 3 -o "$tmp/checksums.txt" "$base/checksums.txt"
        (cd "$tmp" && grep " $archive\$" checksums.txt | sha256sum -c -)
        mkdir -p "$DIR"
        tar -xzf "$tmp/$archive" -C "$DIR" dagger
        rm -rf "$tmp"

    - name: Run Dagger
      shell: bash
      env:
        DIR: ${{ steps.dagger.outputs.dir }}
        VERB: ${{ inputs.verb }}
        ARGS: ${{ inputs.args }}
        # Without a terminal Dagger defaults to "report": a heartbeat and a
        # summary at the end. "logs" streams each command's output as it runs.
        DAGGER_PROGRESS: logs
      run: |
        echo "$DIR" >> "$GITHUB_PATH"
        "$DIR/dagger" version
        # ARGS is split on whitespace (without globbing) into separate arguments.
        set -f
        # shellcheck disable=SC2086
        "$DIR/dagger" "$VERB" $ARGS
